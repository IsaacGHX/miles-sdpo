# TextGrad-style multi-turn CODE training config: ALL ROLES = gpt-5.6-luna
# (Salesforce Research gateway). solver runs the multi-turn code_interpreter
# rollouts; skill_predictor predicts knowledge/pitfall from the bare problem;
# sys_critic rewrites the system-prompt+tool-description bundle from
# WITH-skill trajectories; skill_critic rewrites the skill-prediction prompt
# pair from NO-skill trajectories. Auth: SFT_GATEWAY_KEY (Bearer), loaded from
# ~/gitproj/apis/.env by the launcher.
#
# luna is a reasoning model: the openai backend sends max_completion_tokens
# and omits temperature/top_p for it automatically; when `tools=` is passed
# (the solver role), it also sets reasoning_effort='none' (gateway constraint:
# function tools + reasoning_effort are rejected together on
# /chat/completions -- verified live; see engines.py::OpenAIChatBackend).

rounds: 3
k: 4                          # rollouts per problem PER ARM (pass@k) -- no-skill and with-skill each get k
concurrency: 128               # concurrent trajectories in flight (shared sandbox sidecar; validated stable up to 64, raising to 128 per request)
max_turns: 8                  # per-trajectory tool-call turn budget (matches SDPO_REACT_TRAIN_MAX_TURNS default)

solver_max_tokens: 4096
solver_temperature: 1.0
skill_max_tokens: 2048
skill_temperature: 0.7
critic_max_examples: 16
sys_critic_max_tokens: 8192
skill_critic_max_tokens: 8192

sandbox_timeout: 120.0         # httpx client timeout talking to the sandbox sidecar (127.0.0.1:8420)

use_wandb: true
wandb_project: miles-sdpo
wandb_group: tts-textgrad-code-luna

engines:
  solver:
    backend: openai
    model: gpt-5.6-luna
    base_url: https://gateway.salesforceresearch.ai/openai/process/v1
    api_key_env: SFT_GATEWAY_KEY
    max_tokens: 4096
  skill_predictor:
    backend: openai
    model: gpt-5.6-luna
    base_url: https://gateway.salesforceresearch.ai/openai/process/v1
    api_key_env: SFT_GATEWAY_KEY
    max_tokens: 2048
  sys_critic:
    backend: openai
    model: gpt-5.6-luna
    base_url: https://gateway.salesforceresearch.ai/openai/process/v1
    api_key_env: SFT_GATEWAY_KEY
    max_tokens: 8192
  skill_critic:
    backend: openai
    model: gpt-5.6-luna
    base_url: https://gateway.salesforceresearch.ai/openai/process/v1
    api_key_env: SFT_GATEWAY_KEY
    max_tokens: 8192
