# --eval-config for the AGENTIC domain (webshop + alfworld combined) PLUS
# skill-augmented counterparts of each dataset (see
# sdpo_react.py::sdpo_react_eval_generate_with_skill and
# --sdpo-eval-skill-mode): before the real eval rollout, self-predict a blind
# skill from the problem alone and splice it into the prompt, then run the
# SAME multi-turn tool-calling loop normal eval uses. Used by the ablation
# scripts' arm e/f (both skill types trained -> --sdpo-eval-skill-mode all),
# so wandb shows the normal (no-skill) eval curve side-by-side with the
# skill-augmented one under a distinct dataset name (*_skill) -- neither
# affects the other.
eval:
  defaults:
    max_response_len: 8192
    top_p: 1.0
    tool_key: tools
    metadata_key: metadata
  datasets:
    - name: webshop
      path: /root/data/webshop_data/webshop_eval.jsonl
      rm_type: null
      n_samples_per_eval_prompt: ${oc.decode:${oc.env:SDPO_REACT_EVAL_N_SAMPLES,8}}
      metadata_overrides:
        generate_max_turns: ${oc.decode:${oc.env:SDPO_REACT_EVAL_MAX_TURNS,20}}
    - name: alfworld_ood
      path: /root/data/alfworld_data/alfworld_eval_ood.jsonl
      rm_type: null
      n_samples_per_eval_prompt: ${oc.decode:${oc.env:SDPO_REACT_EVAL_N_SAMPLES,8}}
      metadata_overrides:
        generate_max_turns: ${oc.decode:${oc.env:SDPO_REACT_EVAL_MAX_TURNS,20}}
    - name: webshop_skill
      path: /root/data/webshop_data/webshop_eval.jsonl
      rm_type: null
      custom_generate_function_path: examples.SDPO_ReAct.sdpo_react.sdpo_react_eval_generate_with_skill
      n_samples_per_eval_prompt: ${oc.decode:${oc.env:SDPO_REACT_EVAL_N_SAMPLES,8}}
      metadata_overrides:
        generate_max_turns: ${oc.decode:${oc.env:SDPO_REACT_EVAL_MAX_TURNS,20}}
    - name: alfworld_ood_skill
      path: /root/data/alfworld_data/alfworld_eval_ood.jsonl
      rm_type: null
      custom_generate_function_path: examples.SDPO_ReAct.sdpo_react.sdpo_react_eval_generate_with_skill
      n_samples_per_eval_prompt: ${oc.decode:${oc.env:SDPO_REACT_EVAL_N_SAMPLES,8}}
      metadata_overrides:
        generate_max_turns: ${oc.decode:${oc.env:SDPO_REACT_EVAL_MAX_TURNS,20}}
